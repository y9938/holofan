[package]
name = "holofan"
version = "1.0.0"
edition = "2021"
description = "Cross-platform 3D LED holographic fan display encoder and manager in Rust"
license = "MIT"
repository = "https://github.com/y9938/holofan"
readme = "README.md"
authors = ["y9938"]
keywords = ["hologram", "led-fan", "pov", "display", "encoder"]
categories = ["multimedia", "hardware-support", "gui"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
byteorder = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
sha2 = "0.10"
hidapi = { version = "2.6", optional = true }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
formatjs_intl = "2.2"
icu_locale_core = { version = "2.4", default-features = false, features = ["alloc"] }

[build-dependencies]
cc = "1.2"
icu_locale_core = { version = "2.4", default-features = false, features = ["alloc"] }
serde_json = "1"

[features]
default = ["hid"]
hid = ["dep:hidapi"]

[dev-dependencies]
tempfile = "3"
